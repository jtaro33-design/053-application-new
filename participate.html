<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#28452f">
  <title>053academy｜練習・イベント</title>

  <style>
    :root {
      --green: #2f4d36;
      --green-deep: #213a28;
      --green-soft: #edf3eb;
      --blue-soft: #eef5f9;
      --event-soft: #f7efe6;
      --beige-soft: #f6efe5;
      --text: #273028;
      --sub: #687168;
      --line: #dfe5dd;
      --bg: #f8f7f2;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        "YuGothic",
        "Noto Sans JP",
        sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
    }

    .page {
      width: 100%;
      max-width: 620px;
      min-height: 100svh;
      margin: 0 auto;
      padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 28px 22px 24px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 12px 34px rgba(32,53,38,.08);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -24px;
      top: -14px;
      width: 190px;
      height: 190px;
      background:
        url("https://jtaro33-design.github.io/053-application-new/053-logo.webp")
        center / contain no-repeat;
      opacity: .075;
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-name {
      margin: 0;
      color: var(--green-deep);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .04em;
    }

    .brand-sub {
      margin: 3px 0 0;
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .03em;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 26px 0 0;
      color: var(--green-deep);
      font-size: 29px;
      line-height: 1.35;
      font-weight: 950;
    }

    .lead {
      position: relative;
      z-index: 1;
      margin: 12px 0 0;
      color: var(--sub);
      font-size: 16px;
      line-height: 1.85;
      font-weight: 650;
    }

    .choices {
      display: grid;
      gap: 14px;
      margin-top: 20px;
    }

    .choice {
      display: block;
      position: relative;
      min-height: 110px;
      padding: 20px 54px 18px 20px;
      border-radius: 22px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .choice:active {
      transform: scale(.985);
    }

    .choice-practice {
      border: 1.5px solid #cedce7;
      background: var(--blue-soft);
      color: #355b78;
      box-shadow: 0 8px 24px rgba(53,91,120,.07);
    }

    .choice-event {
      border: 1.5px solid #dfc8ad;
      background: var(--event-soft);
      color: #6f5335;
      box-shadow: 0 8px 24px rgba(113,83,53,.07);
    }

    .choice-calendar {
      border: 1.5px solid #cddbc8;
      background: var(--green-soft);
      color: var(--green-deep);
      box-shadow: 0 8px 24px rgba(41,74,47,.08);
    }

    .choice-label {
      display: block;
      font-size: 21px;
      line-height: 1.35;
      font-weight: 950;
    }

    .choice-note {
      display: block;
      margin-top: 8px;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 750;
      opacity: .84;
    }

    .choice-arrow {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 28px;
      font-weight: 600;
      opacity: .72;
    }

    .help {
      margin-top: 18px;
      padding: 16px 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.78);
    }

    .help-title {
      margin: 0;
      color: var(--green-deep);
      font-size: 15px;
      font-weight: 900;
    }

    .help-text {
      margin: 6px 0 0;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.7;
      font-weight: 650;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: #8a9189;
      font-size: 11px;
      line-height: 1.6;
      font-weight: 650;
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="hero">
      <div class="brand">
        <img
          class="brand-logo"
          src="https://jtaro33-design.github.io/053-application-new/053-logo.webp"
          alt="053academy"
        >

        <div>
          <p class="brand-name">053academy</p>
          <p class="brand-sub">DEVELOPMENT ACADEMY</p>
        </div>
      </div>

      <h1>練習・イベント</h1>

      <p class="lead">
        ご希望の内容からお選びください。
      </p>
    </section>


    <section class="choices">

      <a
        class="choice choice-practice"
        href="https://jtaro33-design.github.io/053-application-new/?mode=practice"
      >
        <span class="choice-label">
          練習に参加する
        </span>

        <span class="choice-note">
          通常練習の日程確認・参加申込
        </span>

        <span class="choice-arrow">›</span>
      </a>


      <a
        class="choice choice-event"
        href="https://jtaro33-design.github.io/053-application-new/?mode=event"
      >
        <span class="choice-label">
          イベントに参加する
        </span>

        <span class="choice-note">
          クリニック・特別イベントの確認・申込
        </span>

        <span class="choice-arrow">›</span>
      </a>


      <a
        class="choice choice-calendar"
        href="https://jtaro33-design.github.io/053-application-new/?mode=calendar"
      >
        <span class="choice-label">
          カレンダーで確認
        </span>

        <span class="choice-note">
          練習・イベントをまとめて確認
        </span>

        <span class="choice-arrow">›</span>
      </a>

    </section>


    <section class="help">
      <p class="help-title">
        迷った場合
      </p>

      <p class="help-text">
        全体の日程を確認したい方は「カレンダーで確認」をお選びください。
      </p>
    </section>


    <footer class="footer">
      053academy
    </footer>

  </main>
</body>
</html>
