<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <title>053academy</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg:#f1f5fa;
      --card:#ffffff;
      --text:#142033;
      --sub:#758195;
      --line:#dce5ef;
      --blue:#2f6fed;
      --blue-soft:#edf4ff;
      --red:#c83f4d;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
    }

    body {
      background:var(--bg);
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      -webkit-text-size-adjust:100%;
    }

    .wrap {
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        20px
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .card {
      width:100%;
      max-width:520px;
      padding:24px 20px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--card);
      box-shadow:
        0 5px 18px
        rgba(32,55,85,.06);
    }

    .brand {
      color:var(--sub);
      font-size:12px;
      font-weight:800;
      letter-spacing:.06em;
    }

    .title {
      margin-top:5px;
      font-size:24px;
      font-weight:950;
      line-height:1.3;
    }

    .message {
      margin-top:12px;
      color:var(--sub);
      font-size:14px;
      line-height:1.7;
    }

    .status {
      margin-top:18px;
      padding:12px 14px;
      border-radius:13px;
      background:var(--blue-soft);
      color:#1f55bf;
      font-size:14px;
      font-weight:850;
      line-height:1.6;
    }

    .status.error {
      background:#fff0f1;
      color:var(--red);
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">053academy</div>

      <div class="title" id="page-title">
        読み込み中
      </div>

      <div class="message">
        LINE認証後、申込ページへ移動します。
      </div>

      <div class="status" id="status">
        LINE認証を確認しています…
      </div>
    </section>
  </main>

  <form
    id="gas-form"
    method="post"
    action="https://script.google.com/macros/s/AKfycbzvkYYrOJdIjlZaI3jsagEpho7IJmh0dQiYHRn2DusXz6zuidQuUjmt9iBKt4Uicyxk/exec"
    style="display:none;"
  >
    <input
      type="hidden"
      name="mode"
      id="form-mode"
      value=""
    >

    <input
      type="hidden"
      name="idToken"
      id="form-id-token"
      value=""
    >

    <input type="hidden" name="entryMode" id="form-entry-mode" value="">
    <input type="hidden" name="clientUserAgent" id="form-client-user-agent" value="">
    <input type="hidden" name="clientUrl" id="form-client-url" value="">
    <input type="hidden" name="liffInClient" id="form-liff-in-client" value="">
    <input type="hidden" name="liffLoggedIn" id="form-liff-logged-in" value="">
    <input type="hidden" name="authStage" id="form-auth-stage" value="">
    <input type="hidden" name="authDetail" id="form-auth-detail" value="">
  </form>

  <script>
    const LIFF_ID =
      '2009553339-EXb6GNt4';

    const MODE_MAP = {
      practice: {
        gasMode:
          'practicePage',

        title:
          '練習参加'
      },

      event: {
        gasMode:
          'eventPage',

        title:
          'イベント参加'
      },

      calendar: {
        gasMode:
          'calendarPage',

        title:
          '予定カレンダー'
      },

      trial: {
        gasMode:
          'trialPage',

        title:
          '無料体験'
      },

      trialadmin: {
        gasMode:
          'trialAdminPage',

        title:
          '無料体験管理'
      },

      member: {
        gasMode:
          'memberPage',

        title:
          '会員登録'
      },

      memberadmin: {
        gasMode:
          'memberAdminPage',

        title:
          '会員登録管理'
      },

      dashboard: {
        gasMode:
          'adminDashboardPage',

        title:
          '管理ダッシュボード'
      },

      practicehostcancel: {
        gasMode:
          'practiceHostCancelAdminPage',

        title:
          '練習開催管理'
      },

      eventhostcancel: {
        gasMode:
          'eventHostCancelAdminPage',

        title:
          'イベント開催管理'
      },

      mypage: {
        gasMode:
          'myPage',

        title:
          'My Page'
      }
    };


    function getModeFromCurrentUrl() {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const directMode =
        String(
          params.get('mode') || ''
        )
          .trim()
          .toLowerCase();

      if (
        MODE_MAP[
          directMode
        ]
      ) {
        return directMode;
      }

      const liffState =
        String(
          params.get('liff.state') ||
          params.get('liffState') ||
          ''
        ).trim();

      if (liffState) {
        try {
          const decoded =
            decodeURIComponent(
              liffState
            );

          const stateUrl =
            new URL(
              decoded,
              window.location.origin
            );

          const stateMode =
            String(
              stateUrl.searchParams.get(
                'mode'
              ) || ''
            )
              .trim()
              .toLowerCase();

          if (
            MODE_MAP[
              stateMode
            ]
          ) {
            return stateMode;
          }

        } catch (error) {
        }
      }

      return '';
    }


    function setStatus(
      message,
      isError
    ) {
      const el =
        document.getElementById(
          'status'
        );

      el.textContent =
        message;

      el.classList.toggle(
        'error',
        isError === true
      );
    }


    function safeLiffInClient() {
      try {
        return (
          typeof liff !== 'undefined' &&
          liff.isInClient()
        )
          ? 'true'
          : 'false';
      } catch (error) {
        return 'unknown';
      }
    }


    function safeLiffLoggedIn() {
      try {
        return (
          typeof liff !== 'undefined' &&
          liff.isLoggedIn()
        )
          ? 'true'
          : 'false';
      } catch (error) {
        return 'unknown';
      }
    }


    function fillClientContext(
      mode
    ) {
      document.getElementById(
        'form-entry-mode'
      ).value =
        String(
          mode || ''
        );

      document.getElementById(
        'form-client-user-agent'
      ).value =
        String(
          navigator.userAgent || ''
        );

      document.getElementById(
        'form-client-url'
      ).value =
        String(
          window.location.href || ''
        );

      document.getElementById(
        'form-liff-in-client'
      ).value =
        safeLiffInClient();

      document.getElementById(
        'form-liff-logged-in'
      ).value =
        safeLiffLoggedIn();
    }


    function submitToGas(
      route,
      idToken,
      mode
    ) {
      document.getElementById(
        'form-mode'
      ).value =
        route.gasMode;

      document.getElementById(
        'form-id-token'
      ).value =
        idToken;

      document.getElementById(
        'form-auth-stage'
      ).value =
        '';

      document.getElementById(
        'form-auth-detail'
      ).value =
        '';

      fillClientContext(
        mode
      );

      setStatus(
        route.title +
        'を開いています…',
        false
      );

      document.getElementById(
        'gas-form'
      ).submit();
    }


    function submitAuthFailure(
      mode,
      stage,
      error
    ) {
      const detail =
        error &&
        error.message
          ? String(error.message)
          : String(
              error ||
              'LINE認証に失敗しました'
            );

      document.getElementById(
        'form-mode'
      ).value =
        'authErrorPage';

      document.getElementById(
        'form-id-token'
      ).value =
        '';

      document.getElementById(
        'form-auth-stage'
      ).value =
        String(
          stage ||
          'client_unknown'
        );

      document.getElementById(
        'form-auth-detail'
      ).value =
        detail.slice(
          0,
          1800
        );

      fillClientContext(
        mode
      );

      setStatus(
        '認証エラーを記録しています…',
        true
      );

      document.getElementById(
        'gas-form'
      ).submit();
    }


    async function start() {
      const mode =
        getModeFromCurrentUrl();

      const route =
        MODE_MAP[mode] ||
        null;

      if (!route) {
        document.title =
          '053academy リンク確認';

        document.getElementById(
          'page-title'
        ).textContent =
          'リンクを確認できません';

        submitAuthFailure(
          mode || 'unknown',
          'entry_invalid_mode',
          new Error(
            '入口情報を確認できませんでした'
          )
        );

        return;
      }

      document.title =
        '053academy ' +
        route.title;

      document.getElementById(
        'page-title'
      ).textContent =
        route.title;

      let authStage =
        'liff_init';

      try {
        setStatus(
          'LINE認証を確認しています…',
          false
        );

        await liff.init({
          liffId:
            LIFF_ID
        });

        authStage =
          'liff_login_state';

        if (
          !liff.isLoggedIn()
        ) {
          setStatus(
            'LINEログインへ移動します…',
            false
          );

          authStage =
            'liff_login_redirect';

          liff.login({
            redirectUri:
              window.location.href
          });

          return;
        }

        authStage =
          'liff_get_id_token';

        const idToken =
          liff.getIDToken();

        if (!idToken) {
          throw new Error(
            'LINE ID Tokenを取得できませんでした'
          );
        }

        authStage =
          'gas_form_post';

        submitToGas(
          route,
          idToken,
          mode
        );

      } catch (error) {
        console.error(
          error
        );

        submitAuthFailure(
          mode,
          authStage,
          error
        );
      }
    }



    start();
  </script>
</body>
</html>
