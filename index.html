<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>
    053academy 練習参加
  </title>


  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #f5f6f8;

      color: #17191c;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
    }

    .page {
      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px;
    }

    .loading {
      text-align: center;

      color: #6b7280;

      font-size: 14px;
    }

    .spinner {
      width: 32px;
      height: 32px;

      margin:
        0 auto 14px;

      border:
        3px solid #e5e7eb;

      border-top-color:
        #111827;

      border-radius:
        50%;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform:
          rotate(360deg);
      }
    }

    .error {
      display: none;

      max-width: 480px;

      background: white;

      border:
        1px solid #fecaca;

      border-radius:
        18px;

      padding:
        20px;

      color:
        #b91c1c;

      line-height:
        1.7;
    }

    .error.visible {
      display: block;
    }

  </style>

</head>


<body>

  <main class="page">

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <div id="loadingText">
        LINE認証中...
      </div>

    </div>


    <div
      id="error"
      class="error"
    ></div>


    <!--
      fetchは使わない。

      LIFF認証後、
      通常のHTMLフォームPOSTで
      GASへ画面遷移する。
    -->
    <form
      id="authForm"
      method="POST"
      action="https://script.google.com/macros/s/AKfycbzvkYYrOJdIjlZaI3jsagEpho7IJmh0dQiYHRn2DusXz6zuidQuUjmt9iBKt4Uicyxk/exec"
      style="display:none;"
    >

      <input
        type="hidden"
        name="mode"
        value="practicePage"
      >

      <input
        id="idTokenInput"
        type="hidden"
        name="idToken"
        value=""
      >

    </form>

  </main>


  <script>

    const LIFF_ID =
      '2009553339-EXb6GNt4';


    const loading =
      document.getElementById(
        'loading'
      );


    const loadingText =
      document.getElementById(
        'loadingText'
      );


    const errorBox =
      document.getElementById(
        'error'
      );


    const authForm =
      document.getElementById(
        'authForm'
      );


    const idTokenInput =
      document.getElementById(
        'idTokenInput'
      );


    window.addEventListener(
      'DOMContentLoaded',
      initialize
    );


    async function initialize() {

      try {

        /*
         * LIFF初期化
         */
        await liff.init({
          liffId:
            LIFF_ID
        });


        /*
         * 未ログインなら
         * LINE Loginへ
         */
        if (
          !liff.isLoggedIn()
        ) {

          liff.login({
            redirectUri:
              window.location.href
          });

          return;
        }


        /*
         * IDトークン取得
         */
        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            'LINE認証情報を取得できませんでした。'
          );
        }


        loadingText.textContent =
          '練習情報を読み込んでいます...';


        /*
         * IDトークンをhidden inputへセット
         */
        idTokenInput.value =
          idToken;


        /*
         * fetchではなく
         * 通常フォームPOST。
         *
         * ここからGASページへ移動する。
         */
        authForm.submit();


      } catch (error) {

        console.error(
          error
        );


        loading.style.display =
          'none';


        errorBox.textContent =
          error.message ||
          '読み込みに失敗しました。';


        errorBox.classList.add(
          'visible'
        );
      }
    }

  </script>

</body>

</html>
