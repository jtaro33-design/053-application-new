<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >
  <title>053academy</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --bg:#f1f5fa;
      --card:#ffffff;
      --text:#142033;
      --sub:#758195;
      --line:#dce5ef;
      --blue:#2f6fed;
      --blue-soft:#edf4ff;
      --red:#c83f4d;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      width:100%;
      min-height:100%;
      margin:0;
      padding:0;
    }

    body {
      background:var(--bg);
      color:var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      -webkit-text-size-adjust:100%;
    }

    .wrap {
      min-height:100dvh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        20px
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
    }

    .card {
      width:100%;
      max-width:520px;
      padding:24px 20px;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--card);
      box-shadow:
        0 5px 18px
        rgba(32,55,85,.06);
    }

    .brand {
      color:var(--sub);
      font-size:12px;
      font-weight:800;
      letter-spacing:.06em;
    }

    .title {
      margin-top:5px;
      font-size:24px;
      font-weight:950;
      line-height:1.3;
    }

    .message {
      margin-top:12px;
      color:var(--sub);
      font-size:14px;
      line-height:1.7;
    }

    .status {
      margin-top:18px;
      padding:12px 14px;
      border-radius:13px;
      background:var(--blue-soft);
      color:#1f55bf;
      font-size:14px;
      font-weight:850;
      line-height:1.6;
    }

    .status.error {
      background:#fff0f1;
      color:var(--red);
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="brand">053academy</div>

      <div class="title" id="page-title">
        読み込み中
      </div>

      <div class="message">
        LINE認証後、申込ページへ移動します。
      </div>

      <div class="status" id="status">
        LINE認証を確認しています…
      </div>
    </section>
  </main>

  <form
    id="gas-form"
    method="post"
    action="https://script.google.com/macros/s/AKfycbzvkYYrOJdIjlZaI3jsagEpho7IJmh0dQiYHRn2DusXz6zuidQuUjmt9iBKt4Uicyxk/exec"
    style="display:none;"
  >
    <input
      type="hidden"
      name="mode"
      id="form-mode"
      value=""
    >

    <input
      type="hidden"
      name="idToken"
      id="form-id-token"
      value=""
    >
  </form>

  <script>
    const LIFF_ID =
      '2009553339-EXb6GNt4';

    const MODE_MAP = {
      practice: {
        gasMode:
          'practicePage',

        title:
          '練習参加'
      },

      event: {
        gasMode:
          'eventPage',

        title:
          'イベント参加'
      },

      calendar: {
        gasMode:
          'calendarPage',

        title:
          '予定カレンダー'
      }
    };


    function getModeFromCurrentUrl() {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const directMode =
        String(
          params.get('mode') || ''
        )
          .trim()
          .toLowerCase();

      if (
        MODE_MAP[
          directMode
        ]
      ) {
        return directMode;
      }

      const liffState =
        String(
          params.get('liff.state') ||
          params.get('liffState') ||
          ''
        ).trim();

      if (liffState) {
        try {
          const decoded =
            decodeURIComponent(
              liffState
            );

          const stateUrl =
            new URL(
              decoded,
              window.location.origin
            );

          const stateMode =
            String(
              stateUrl.searchParams.get(
                'mode'
              ) || ''
            )
              .trim()
              .toLowerCase();

          if (
            MODE_MAP[
              stateMode
            ]
          ) {
            return stateMode;
          }

        } catch (error) {
        }
      }

      return 'practice';
    }


    function setStatus(
      message,
      isError
    ) {
      const el =
        document.getElementById(
          'status'
        );

      el.textContent =
        message;

      el.classList.toggle(
        'error',
        isError === true
      );
    }


    function submitToGas(
      route,
      idToken
    ) {
      document.getElementById(
        'form-mode'
      ).value =
        route.gasMode;

      document.getElementById(
        'form-id-token'
      ).value =
        idToken;

      setStatus(
        route.title +
        'を開いています…',
        false
      );

      document.getElementById(
        'gas-form'
      ).submit();
    }


    async function start() {
      const mode =
        getModeFromCurrentUrl();

      const route =
        MODE_MAP[mode] ||
        MODE_MAP.practice;

      document.title =
        '053academy ' +
        route.title;

      document.getElementById(
        'page-title'
      ).textContent =
        route.title;


      try {
        setStatus(
          'LINE認証を確認しています…',
          false
        );

        await liff.init({
          liffId:
            LIFF_ID
        });


        if (
          !liff.isLoggedIn()
        ) {
          setStatus(
            'LINEログインへ移動します…',
            false
          );

          liff.login({
            redirectUri:
              window.location.href
          });

          return;
        }


        const idToken =
          liff.getIDToken();


        if (!idToken) {
          throw new Error(
            'LINE ID Tokenを取得できませんでした'
          );
        }


        submitToGas(
          route,
          idToken
        );

      } catch (error) {
        console.error(
          error
        );

        setStatus(
          (
            error &&
            error.message
          )
            ? error.message
            : 'LINE認証に失敗しました',
          true
        );
      }
    }


    start();
  </script>
</body>
</html>
